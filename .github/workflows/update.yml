# Fetches fresh guild data from Blizzard and publishes the site to GitHub Pages.
# Runs every hour, whenever main changes (e.g. someone edits site/guild.json),
# and on demand from the Actions tab ("Run workflow").
name: Update site

on:
  schedule:
    - cron: "23 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to save newly claimed guild firsts in site/firsts.json
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Fetch guild data from Blizzard
        env:
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          WOW_REGION: eu
        run: python3 fetch_roster.py --out site/data --ledger site/firsts.json --milestones site/milestones.json > /dev/null

      # Only commits when someone has claimed a milestone. Pushes made with the workflow's own
      # token don't start another run. If saving fails, the site still deploys.
      - name: Save newly claimed guild firsts
        continue-on-error: true
        run: |
          if ! git diff --quiet -- site/firsts.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/firsts.json
            git commit -q -m "Record new guild firsts"
            git pull -q --rebase origin main
            git push -q origin HEAD:main
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
