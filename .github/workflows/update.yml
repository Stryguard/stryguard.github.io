# Fetches fresh guild data from Blizzard and publishes the site to GitHub Pages.
# Runs every hour, whenever main changes (e.g. someone edits site/guild.json),
# and on demand from the Actions tab ("Run workflow").
name: Update site

on:
  schedule:
    - cron: "23 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Fetch guild data from Blizzard
        env:
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          WOW_REGION: eu
        run: python3 fetch_roster.py --out site/data > /dev/null

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
